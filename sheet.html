<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MiniSheet</title>
<style>
:root{--bg:#fff;--fg:#1f2937;--hd:#f3f4f6;--bd:#d1d5db;--ac:#217346;--sel:#e6f4ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d21;--fg:#e5e7eb;--hd:#2a2d33;--bd:#3f434b;--sel:#1f3a2a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1d21;--fg:#e5e7eb;--hd:#2a2d33;--bd:#3f434b;--sel:#1f3a2a;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;display:flex;flex-direction:column}
.bar{display:flex;gap:6px;align-items:center;padding:6px;background:var(--hd);border-bottom:1px solid var(--bd);flex-wrap:wrap}
button{background:var(--ac);color:#fff;border:0;border-radius:4px;padding:6px 10px;font-size:13px}
.q{background:var(--bg);color:var(--fg);border:1px solid var(--bd);min-width:40px;padding:8px 10px;font-size:16px}
#ref{width:48px;text-align:center;font-weight:600}
#fx{flex:1;min-width:120px;padding:8px;font-size:16px;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:4px}
#wrap{flex:1;overflow:auto}
table{border-collapse:collapse;table-layout:fixed}
th,td{border:1px solid var(--bd);height:36px;padding:0}
th{background:var(--hd);position:sticky;top:0;z-index:1;width:100px;font-weight:600}
th.r{left:0;width:36px;z-index:2;position:sticky}
td.r{background:var(--hd);text-align:center;position:sticky;left:0;font-weight:600}
td.c{padding:0 4px;overflow:hidden;white-space:nowrap;cursor:cell}
td.c.s{outline:2px solid var(--ac);outline-offset:-2px;background:var(--sel)}
td.n{text-align:right}
td input{width:100%;height:100%;border:0;padding:0 4px;box-sizing:border-box;background:var(--bg);color:var(--fg);font:inherit;outline:2px solid var(--ac)}
</style>
</head>
<body>
<div class="bar">
<span id="ref">A1</span>
<input id="fx" placeholder="Cell chuno, yahan type karo, phir ✓ dabao">
<button id="ok">✓</button><button id="imp">CSV Open</button>
<button id="exp">CSV Save</button>
<button id="clr">Clear</button>
<input type="file" id="file" accept=".csv,text/csv" hidden>
</div>
<div class="bar" id="qk"><button class="q" data-i="=">=</button><button class="q" data-i="SUM(">SUM</button><button class="q" data-i="AVERAGE(">AVG</button><button class="q" data-i="MIN(">MIN</button><button class="q" data-i="MAX(">MAX</button><button class="q" data-i="+">+</button><button class="q" data-i="-">−</button><button class="q" data-i="*">×</button><button class="q" data-i="/">÷</button><button class="q" data-i="^">^</button><button class="q" data-i="(">(</button><button class="q" data-i=")">)</button><button class="q" data-i=":">:</button><button class="q" data-i=",">,</button><button class="q" id="undo">↶ Undo</button></div>
<div id="wrap"><table id="t"></table></div>
<script>
const R=50,C=15;
let data={},sel=[0,0],cache={};
const col=i=>String.fromCharCode(65+i);
const key=(r,c)=>col(c)+(r+1);
const parseRef=s=>{const m=/^([A-Z])(\d+)$/.exec(s);return m?[+m[2]-1,m[1].charCodeAt(0)-65]:null};
function range(a,b){const A=parseRef(a),B=parseRef(b),o=[];if(!A||!B)return o;
for(let r=Math.min(A[0],B[0]);r<=Math.max(A[0],B[0]);r++)for(let c=Math.min(A[1],B[1]);c<=Math.max(A[1],B[1]);c++)o.push(key(r,c));return o}
const FN={
SUM:a=>a.reduce((x,y)=>x+y,0),
AVERAGE:a=>a.length?FN.SUM(a)/a.length:0,
MIN:a=>Math.min(...a),MAX:a=>Math.max(...a),
COUNT:a=>a.length,
IF:(c,a,b)=>c?a:b,
SQRT:a=>Math.sqrt(a[0]),ABS:a=>Math.abs(a[0]),
ROUND:a=>{const d=a[1]||0;return Math.round(a[0]*10**d)/10**d}
};
function val(k,stack=[]){
 if(cache[k]!==undefined)return cache[k];
 const raw=data[k];let v;
 if(raw===undefined||raw==="")v="";
 else if(raw[0]==="="){
  if(stack.includes(k))return "#CIRC";
  try{v=evalF(raw.slice(1),[...stack,k]);}catch(e){v="#ERR"}
 }else v=raw!==""&&!isNaN(raw)?+raw:raw;
 cache[k]=v;return v;
}
function evalF(f,st){
 let e=f.toUpperCase().replace(/\^/g,"**");
 e=e.replace(/([A-Z]\d+):([A-Z]\d+)/g,(_,a,b)=>"["+range(a,b).map(k=>"N('"+k+"')").join(",")+"]");
 e=e.replace(/\b([A-Z]\d+)\b(?!')/g,(m,k)=>"N('"+k+"')");
 e=e.replace(/\b(SUM|AVERAGE|MIN|MAX|COUNT|SQRT|ABS|ROUND)\(/g,"FN.$1(");
 e=e.replace(/\bIF\(/g,"FN.IF(");
 const N=k=>{const x=val(k,st);return typeof x==="number"?x:(x===""?0:x)};
 const flat=new Function("FN","N","return ("+e+")");
 // ranges are arrays: flatten & keep numbers only for aggregate fns
 const FN2={...FN};
 ["SUM","AVERAGE","MIN","MAX","COUNT"].forEach(n=>FN2[n]=(...a)=>FN[n](a.flat().filter(x=>typeof x==="number")));
 const r=flat(FN2,N);
 return typeof r==="number"&&!isFinite(r)?"#ERR":r;
}
function build(){
 let h="<tr><th class='r'></th>";
 for(let c=0;c<C;c++)h+="<th>"+col(c)+"</th>";
 h+="</tr>";
 for(let r=0;r<R;r++){h+="<tr><td class='r'>"+(r+1)+"</td>";
  for(let c=0;c<C;c++)h+="<td class='c' data-r='"+r+"' data-c='"+c+"'></td>";h+="</tr>"}
 t.innerHTML=h;
}
function render(){
 cache={};
 t.querySelectorAll("td.c").forEach(td=>{
  const r=+td.dataset.r,c=+td.dataset.c,k=key(r,c),v=val(k);
  td.textContent=v;td.classList.toggle("n",typeof v==="number");
  td.classList.toggle("s",r===sel[0]&&c===sel[1]);
 });
 ref.textContent=key(...sel);
 try{localStorage.setItem("ms",JSON.stringify(data))}catch(_){}
 fx.value=data[key(...sel)]||"";
}
let U=[],fxA=false,fxCell=null;
function setCell(k,v){U.push(JSON.stringify(data));if(U.length>50)U.shift();if(v==="")delete data[k];else data[k]=v}
function undo(){if(U.length){data=JSON.parse(U.pop());render()}}
function pointing(){const b=fx.value.slice(0,fx.selectionStart);return fxA&&fx.value[0]==="="&&/[=(+\-*\/^,:]$/.test(b)}
function ins(s){const a=fx.selectionStart,b=fx.selectionEnd;fx.value=fx.value.slice(0,a)+s+fx.value.slice(b);fx.focus();fx.setSelectionRange(a+s.length,a+s.length)}
fx.onfocus=()=>{fxA=true;fxCell=key(...sel)};
fx.onblur=()=>{fxA=false;if(fxCell&&fx.value!==(data[fxCell]||"")){setCell(fxCell,fx.value);render()}};
function select(r,c){sel=[Math.max(0,Math.min(R-1,r)),Math.max(0,Math.min(C-1,c))];render();
 t.querySelector(`td[data-r='${sel[0]}'][data-c='${sel[1]}']`).scrollIntoView({block:"nearest",inline:"nearest"})}
function edit(td,init){
 const k=key(sel[0],sel[1]);
 const i=document.createElement("input");i.value=init!==undefined?init:(data[k]||"");
 td.textContent="";td.appendChild(i);i.focus();
 let done=false;
 const fin=(move)=>{if(done)return;done=true;setCell(k,i.value);render();if(move)select(sel[0]+move[0],sel[1]+move[1])};
 i.onkeydown=e=>{
  if(e.key==="Enter"){e.preventDefault();fin([1,0])}
  else if(e.key==="Tab"){e.preventDefault();fin([0,1])}
  else if(e.key==="Escape"){done=true;render()}
 };
 i.onblur=()=>fin();
}
t.addEventListener("mousedown",e=>{if(pointing())e.preventDefault()});
t.addEventListener("click",e=>{const td=e.target.closest("td.c");if(!td)return;const r=+td.dataset.r,c=+td.dataset.c;
 if(pointing()){ins(key(r,c));return}
 const same=r===sel[0]&&c===sel[1];select(r,c);if(same)fx.focus()});
qk.addEventListener("mousedown",e=>e.preventDefault());
qk.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.id==="undo"){undo();return}
 if(!fxA){fx.focus();fx.setSelectionRange(fx.value.length,fx.value.length)}
 const s=b.dataset.i;if(s.length>1&&fx.value==="")fx.value="=";ins(s)});
ok.onclick=()=>select(sel[0]+1,sel[1]);
t.addEventListener("dblclick",e=>{const td=e.target.closest("td.c");if(td)edit(td)});
document.addEventListener("keydown",e=>{
 if(e.target.tagName==="INPUT")return;
 const td=()=>t.querySelector(`td[data-r='${sel[0]}'][data-c='${sel[1]}']`);
 if(e.key==="ArrowDown")select(sel[0]+1,sel[1]);
 else if(e.key==="ArrowUp")select(sel[0]-1,sel[1]);
 else if(e.key==="ArrowLeft")select(sel[0],sel[1]-1);
 else if(e.key==="ArrowRight")select(sel[0],sel[1]+1);
 else if(e.key==="Delete"||e.key==="Backspace"){setCell(key(...sel),"");render()}
 else if(e.key==="Enter"||e.key==="F2")edit(td());
 else if(e.key.length===1&&!e.ctrlKey&&!e.metaKey)edit(td(),e.key);
 else return;
 e.preventDefault();
});
fx.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();fx.blur();select(sel[0]+1,sel[1])}else if(e.key==="Escape"){fx.value=data[fxCell]||"";fx.blur()}};
exp.onclick=()=>{
 let rows=[],mr=0,mc=0;
 Object.keys(data).forEach(k=>{const p=parseRef(k);mr=Math.max(mr,p[0]);mc=Math.max(mc,p[1])});
 for(let r=0;r<=mr;r++){const row=[];for(let c=0;c<=mc;c++){const v=String(val(key(r,c)));row.push(/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v)}rows.push(row.join(","))}
 const csv=rows.join("\n");
 const w=window.open("","_blank");
 try{const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);a.download="sheet.csv";a.click()}catch(_){}
 if(w)w.close();
};
imp.onclick=()=>file.click();
file.onchange=()=>{
 const f=file.files[0];if(!f)return;
 f.text().then(txt=>{
  data={};
  txt.split(/\r?\n/).forEach((line,r)=>{
   const cells=line.match(/("([^"]|"")*"|[^,]*)(,|$)/g)||[];
   cells.forEach((s,c)=>{s=s.replace(/,$/,"");if(s[0]==='"')s=s.slice(1,-1).replace(/""/g,'"');if(s!==""&&r<R&&c<C)data[key(r,c)]=s});
  });
  render();
 });
};
clr.onclick=()=>{U.push(JSON.stringify(data));data={};render()};
try{data=JSON.parse(localStorage.getItem("ms")||"{}")}catch(_){}
build();render();
</script>
</body>
</html>
