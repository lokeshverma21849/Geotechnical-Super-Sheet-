name: Build Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        shell: bash
        run: |
          mkdir -p desktop/www
          cp www/index.html desktop/www/index.html
          cp main.js preload.js desktop/
          cp desktop-package.json desktop/package.json
          cd desktop
          npm install
          npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: MiniSheet-Windows
          path: desktop/dist/*.exe
